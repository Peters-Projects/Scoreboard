<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Force app layout configurations on Apple devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scoreboard">
  
  <title>Digital Scoreboard App</title>
  <style>
    /* Prevent all iPad scrolling, double-taps, zooming, and long-press menus */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none; 
      -webkit-user-select: none;   
      user-select: none;
      touch-action: manipulation;  
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Impact', 'Arial Black', -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .team-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    .home-side {
      background-color: #040d1a;
      border-right: 4px solid #0d1b2e;
    }

    .away-side {
      background-color: #1a1604;
    }

    .score-touch-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .team-name {
      font-size: 5vw;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: none;
      background: transparent;
      text-align: center;
      width: 90%;
      outline: none;
    }
    
    .home-side .team-name, .home-side .score-number { 
      color: White; 
      text-shadow: 0 0 20px rgba(0, 122, 255, 0.3);
    } 
    .away-side .team-name, .away-side .score-number { 
      color: Gold; 
      text-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
    } 

    .score-number {
      font-size: 42vw; 
      max-height: 72vh; 
      font-weight: 900;
      font-variant-numeric: tabular-nums; 
      line-height: 0.82;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-bar {
      height: 14vh;
      display: flex;
      background: rgba(0, 0, 0, 0.4);
    }

    .minus-btn {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.2);
      font-size: 8vh;
      font-weight: 300;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    
    .minus-btn:active {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
    }

    .global-reset {
      position: absolute;
      bottom: calc(14vh + 15px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 1.5vw;
      font-family: sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      z-index: 10;
    }
    .global-reset:active {
      background: #ff3b30;
      color: #fff;
    }
  </style>
</head>
<body>

  <button class="global-reset" onclick="resetAll()">Reset</button>

  <div class="team-panel home-side">
    <div class="score-touch-zone" onclick="changeScore('home', 1)">
      <input type="text" class="team-name" value="WHITE SOX" onclick="event.stopPropagation()">
      <div class="score-number" id="home-score">0</div>
    </div>
    <div class="control-bar">
      <button class="minus-btn" onclick="changeScore('home', -1)">−</button>
    </div>
  </div>

  <div class="team-panel away-side">
    <div class="score-touch-zone" onclick="changeScore('away', 1)">
      <input type="text" class="team-name" value="PIRATES" onclick="event.stopPropagation()">
      <div class="score-number" id="away-score">0</div>
    </div>
    <div class="control-bar">
      <button class="minus-btn" onclick="changeScore('away', -1)">−</button>
    </div>
  </div>

  <script>
    let scores = { home: 0, away: 0 };

    function changeScore(team, amount) {
      scores[team] += amount;
      if (scores[team] < 0) scores[team] = 0;
      document.getElementById(`${team}-score`).innerText = scores[team];
    }

    function resetAll() {
      if (confirm("Reset the scoreboard scores?")) {
        scores.home = 0;
        scores.away = 0;
        document.getElementById('home-score').innerText = 0;
        document.getElementById('away-score').innerText = 0;
      }
    }
  </script>
</body>
</html>
